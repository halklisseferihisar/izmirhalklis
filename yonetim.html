<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Yönetim Kadromuz</title>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:#050505;
      color:white;
      overflow-x:hidden;
    }

    .page{

      min-height:100vh;

      padding:100px 10%;

      background:
      radial-gradient(circle at top left,
      rgba(255,0,60,.10),
      transparent 35%),

      radial-gradient(circle at bottom right,
      rgba(255,0,60,.08),
      transparent 30%),

      #050505;
    }

    .title{
      text-align:center;
      margin-bottom:80px;
    }

    .title h1{
      font-size:58px;
      color:#ff214f;
      margin-bottom:18px;
      font-weight:900;
    }

    .title p{
      color:#bdbdbd;
      font-size:18px;
      max-width:700px;
      margin:auto;
      line-height:1.8;
    }

    .leaders-grid{
      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(360px,1fr));

      gap:45px;
    }

    .leader-card{

      position:relative;

      background:
      linear-gradient(145deg,#121212,#090909);

      border:
      1px solid rgba(255,255,255,.06);

      border-radius:34px;

      overflow:hidden;

      transition:.35s ease;

      box-shadow:
      0 18px 55px rgba(0,0,0,.45);
    }

    .leader-card::before{
      content:"";

      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:5px;

      background:
      linear-gradient(90deg,#ff003c,#ff5b7e);

      z-index:3;
    }

    .leader-card:hover{
      transform:translateY(-10px);

      border-color:#ff214f;

      box-shadow:
      0 25px 65px rgba(255,0,60,.22);
    }

    /* FOTO */

    .leader-image-box{
      width:100%;
      height:620px;

      overflow:hidden;

      position:relative;

      background:#0a0a0a;
    }

    .leader-image{
      width:100%;
      height:100%;

      object-fit:cover;

      object-position:center top;

      transition:.45s ease;
    }

    .leader-card:hover .leader-image{
      transform:scale(1.04);
    }

    .leader-overlay{
      position:absolute;
      inset:0;

      background:
      linear-gradient(
      to top,
      rgba(0,0,0,.92),
      rgba(0,0,0,.25),
      transparent);

      z-index:1;
    }

    /* CONTENT */

    .leader-content{
      padding:34px;
      position:relative;
      z-index:2;
    }

    .leader-role{
      display:inline-block;

      color:#ff214f;

      background:
      rgba(255,33,79,.10);

      border:
      1px solid rgba(255,33,79,.25);

      padding:8px 16px;

      border-radius:30px;

      font-size:14px;
      font-weight:bold;

      margin-bottom:20px;
    }

    .leader-content h2{
      color:white;
      font-size:36px;
      margin-bottom:14px;
      font-weight:900;
    }

    .leader-content p{
      color:#d0d0d0;
      line-height:1.9;
      font-size:16px;
    }

    /* SOSYAL */

    .socials{
      margin-top:24px;
      display:flex;
      gap:14px;
    }

    .socials a{
      width:44px;
      height:44px;

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#111;

      border:1px solid rgba(255,255,255,.08);

      color:#ff214f;

      text-decoration:none;

      font-size:18px;

      transition:.3s;
    }

    .socials a:hover{
      background:#ff214f;
      color:white;

      transform:translateY(-4px);
    }

    /* BACK BUTTON */

    .back-btn{
      display:inline-block;

      margin-top:70px;

      background:#ff214f;

      color:white;

      text-decoration:none;

      padding:14px 28px;

      border-radius:12px;

      font-weight:bold;

      transition:.3s;
    }

    .back-btn:hover{
      background:#ff4d73;
    }

    .back-center{
      text-align:center;
    }

    /* MOBIL */

    @media(max-width:768px){

      .page{
        padding:80px 6%;
      }

      .title h1{
        font-size:38px;
      }

      .leader-image-box{
        height:520px;
      }

      .leader-content h2{
        font-size:28px;
      }

    }

  </style>

</head>

<body>

  <section class="page">

    <div class="title">

      <h1>Yönetim Kadromuz</h1>

      <p>
       
      </p>

    </div>

    <div class="leaders-grid">

        </div>

        <div class="leader-content">

          <span class="leader-role">
            Genel Başkan
          </span>

          <h2>Deniz Efe Karaaslan</h2>


          <p>
            Cumhuriyet Halk Partisi Halkçı Liseliler Genel Başkanı
          </p>

          <<div class="socials">

  <a href="https://www.instagram.com/denizefekaraaslan/"
  target="_blank">

    <i class="fa-brands fa-instagram"></i>

  </a>

</div>

        </div>

      </div>

      <!-- İL BAŞKANI -->

      <div class="leader-card">

        <div class="leader-image-box">

          <div class="leader-overlay"></div>

          <img src="ilbaskani.jpg"
          class="leader-image">

        </div>

        <div class="leader-content">

          <span class="leader-role">
            İzmir İl Başkanı
          </span>

          <p>
            Halk-Lis İzmir örgütlenmesini yöneten

          </p>

          <div class="socials">

  </a>

</div>

        </div>

      </div>

    </div>

    <div class="back-center">

      <a href="index.html"

        Ana Sayfaya Dön

      </a>

    </div>

  </section>

</body>
</html>
